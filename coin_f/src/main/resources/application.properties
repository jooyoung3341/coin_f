spring.application.name=coin_f
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# 수집 작업들이 서로 막지 않도록 스케줄러 스레드 4개
spring.task.scheduling.pool.size=4

# ---------------------------------------------------------------
# MySQL (DB/테이블은 src/main/resources/db/schema.sql 로 직접 생성)
# 비밀번호는 환경변수 DB_PASSWORD 로 주입하거나 아래 기본값 자리에 입력
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/futures?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Welcome1@}
spring.datasource.hikari.maximum-pool-size=5
# DB 장애 시 수집 스레드가 오래 묶이지 않도록 (기본 30초 → 3초)
spring.datasource.hikari.connection-timeout=3000

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# DB 저장 on/off (false 면 DB 없이도 화면은 동작)
app.storage.enabled=true

# ---------------------------------------------------------------
# AI 분석 (7단계)
#   rule   : 규칙 기반 분석 (무료, 기본)
#   claude : (추후) Claude API — API 키 필요
# ---------------------------------------------------------------
app.ai.generator=rule
# 생성 주기 (ms) — 유료 AI 로 바꾸면 비용은 이 주기로 결정됨
app.ai.interval-ms=3600000
# 서버 시작 후 첫 생성까지 대기 (시세·OI 수집 완료 대기)
app.ai.initial-delay-ms=90000

# ---------------------------------------------------------------
# 시장 데이터
#   binance : Binance Futures 실데이터 (기본)
#   sample  : 오프라인 화면 개발용 샘플 데이터
# ---------------------------------------------------------------
app.market.source=binance
# 분석 대상 종목 (초기 3종)
app.market.symbols=BTCUSDT,ETHUSDT,SOLUSDT

# Binance USDⓈ-M Futures 공개 API (API 키 불필요)
app.binance.base-url=https://fapi.binance.com
# 주의: 구 경로(/ws/...)는 연결만 되고 데이터가 오지 않음 → /market/ws/ 사용
app.binance.liquidation-ws-url=wss://fstream.binance.com/market/ws/!forceOrder@arr
# 시세·펀딩비 수집 주기 / OI·롱숏 수집 주기 (ms)
app.binance.fast-interval-ms=10000
app.binance.slow-interval-ms=300000
# OI·롱숏을 추적할 거래대금 상위 종목 수 (+ 기본 종목)
app.binance.universe-size=30
# 펀딩비 순위에 포함할 최소 24h 거래대금 (USD) — 저유동성 종목 왜곡 방지
app.binance.min-volume-usd=20000000

# ---------------------------------------------------------------
# 시가총액 필터 (CoinGecko 공개 API, 키 불필요, 30분 주기)
#   원화 시가총액이 아래 값 미만인 코인은 모든 화면·수집에서 제외 (기본 종목은 항상 포함)
# ---------------------------------------------------------------
app.marketcap.base-url=https://api.coingecko.com/api/v3
# 1조 원
app.marketcap.min-krw=1000000000000
