<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 공통 head -->
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' · Futures Insight'">Futures Insight</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- 좌측 사이드바 -->
<aside th:fragment="sidebar" class="fi-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="fiSidebar">
	<div class="fi-brand">
		<a th:href="@{/}" class="text-decoration-none">
			<span class="fi-logo"><i class="bi bi-activity"></i></span>
			<span>
				<strong>Futures Insight</strong>
				<small>Crypto Futures Market Intelligence</small>
			</span>
		</a>
		<button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#fiSidebar"></button>
	</div>
	<nav class="fi-nav">
		<a th:each="m : ${menus}" th:href="@{${m.path}}"
		   th:classappend="${activeMenu == m} ? 'active'" class="fi-nav-item">
			<i class="bi" th:classappend="${m.icon}"></i>
			<span class="fi-nav-text">
				<span class="fi-nav-title" th:text="${m.title}">메뉴</span>
				<span class="fi-nav-desc" th:text="${m.description}">설명</span>
			</span>
			<span class="fi-nav-no" th:text="${m.no}">01</span>
		</a>
	</nav>
	<div class="fi-sidebar-foot">
		<div><i class="bi bi-hdd-network"></i> Binance Futures</div>
		<div class="text-muted small">초기 대상: <span th:text="${#strings.listJoin(symbols, ', ')}"></span></div>
	</div>
</aside>

<!-- 상단 바 -->
<header th:fragment="topbar" class="fi-topbar">
	<button class="btn btn-sm btn-outline-secondary d-lg-none me-2" type="button"
			data-bs-toggle="offcanvas" data-bs-target="#fiSidebar"><i class="bi bi-list"></i></button>
	<div class="me-auto">
		<div class="fi-page-no" th:text="${activeMenu.no}">01</div>
		<h1 class="fi-page-title" th:text="${activeMenu.title}">대시보드</h1>
	</div>
	<div class="d-none d-md-flex gap-1">
		<a th:each="s : ${symbols}" th:href="@{/coin/{s}(s=${s})}" class="btn btn-sm fi-chip"
		   th:text="${@fmt.base(s)}">BTC</a>
	</div>
	<span class="fi-clock ms-3" id="fiClock">--:--:--</span>
</header>

<!-- 공통 스크립트 -->
<th:block th:fragment="scripts">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
